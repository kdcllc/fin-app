name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Creating a GitHub Release requires write. Repo Settings → Actions → General
# → Workflow permissions must also be "Read and write permissions"; otherwise
# GITHUB_TOKEN stays read-only and tauri-action fails with
# "Resource not accessible by integration".
permissions:
  contents: write

# Pushes to main run one at a time so two merges can never race to publish the same
# version; superseded PR runs are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.meta.outputs.is_release }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A release is published when (a) a v* tag is pushed, or (b) a push to main carries
      # a version (src-tauri/tauri.conf.json) that has no v<version> tag yet — so merging
      # a PR that bumps the version cuts the release automatically. The three version
      # files must agree on every run.
      - name: Decide whether this run publishes a release
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          conf=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          pkg=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          cargo=$(python3 -c "import re;print(re.search(r'(?m)^version\s*=\s*\"([^\"]+)\"', open('src-tauri/Cargo.toml').read()).group(1))")
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::Version mismatch: tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo (bump all three together)."
            exit 1
          fi
          is_release=false
          tag="v${conf}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "v${conf}" ]; then
              echo "::error::Tag $tag does not match the app version v${conf}."
              exit 1
            fi
            is_release=true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            # --exit-code: 0 = tag exists, 2 = no such tag; anything else is a lookup failure
            # and must not be mistaken for "no tag" (that would re-publish).
            set +e
            git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "Tag ${tag} already exists — no release for this push (bump the version to cut one)."
            elif [ "$rc" -eq 2 ]; then
              is_release=true
              echo "Version ${conf} has no tag yet — this push to main publishes ${tag}."
            else
              echo "::error::Could not look up tag ${tag} on origin (git ls-remote exit ${rc})."
              exit 1
            fi
          fi
          {
            echo "is_release=${is_release}"
            echo "tag=${tag}"
            echo "version=${conf}"
          } >> "$GITHUB_OUTPUT"

  quality-js:
    name: Lint, Typecheck, and Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

  quality-rust:
    name: Rust Tests and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux system dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$f"
            fi
          done
          for attempt in 1 2 3; do
            if sudo apt-get update \
              && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev \
                libgtk-3-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                patchelf; then
              exit 0
            fi
            echo "apt failed (attempt ${attempt}); retrying..."
            sleep 5
          done
          echo "apt failed after 3 attempts"
          exit 1

      - name: Test (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy gate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  build-tauri:
    name: Build Tauri (${{ matrix.platform }})
    # Platform builds run on PRs, pushes to main, and v* tags; release mode (signing +
    # publishing) is decided by the release-meta job (needs.release-meta.outputs.is_release). This repo is
    # public, so standard GitHub-hosted runners (incl. macOS/Windows) cost no
    # Actions minutes. PR/push builds are unsigned and publish nothing — they
    # prove all three platforms still build and bundle. A release is cut by
    # pushing a v* tag.
    needs:
      - release-meta
      - quality-js
      - quality-rust
    permissions:
      contents: write
    # latest.json race (tag builds only): each matrix job runs tauri-action with
    # includeUpdaterJson, which read-merge-writes latest.json on the GitHub
    # Release. Parallel jobs overwrite each other and can drop platform entries.
    # Strategy: serialized release upload — max-parallel: 1 when this run publishes a
    # release, so each platform finishes publishing before the next starts. Other
    # builds publish nothing and stay fully parallel. A latest.json still missing
    # Linux, Windows, or macOS fails the verify-release job (not accepted).
    strategy:
      fail-fast: false
      max-parallel: ${{ needs.release-meta.outputs.is_release == 'true' && 1 || 3 }}
      matrix:
        platform:
          # Pinned to 22.04 (not -latest): binaries link against the build
          # machine's glibc, and a deb built on 24.04 (glibc 2.39) won't run
          # on Ubuntu 22.04 (glibc 2.35). NOTE: the ubuntu-22.04 runner label
          # is deprecated 2026-09-17 and retired 2027-04-17
          # (actions/runner-images#14254) — before then, move this job into an
          # ubuntu:22.04 container on a newer runner to keep glibc 2.35 compat.
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache's default key doesn't include the distro version — an
          # ubuntu-latest (24.04/glibc 2.39) cache restored onto the pinned
          # ubuntu-22.04 (glibc 2.35) runner poisons the build: cached proc-macro
          # dylibs fail with "version `GLIBC_2.39' not found". Keying by
          # matrix.platform isolates caches per runner image.
          key: ${{ matrix.platform }}
          workspaces: |
            src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$f"
            fi
          done
          for attempt in 1 2 3; do
            if sudo apt-get update \
              && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev \
                libgtk-3-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                patchelf; then
              exit 0
            fi
            echo "apt failed (attempt ${attempt}); retrying..."
            sleep 5
          done
          echo "apt failed after 3 attempts"
          exit 1

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      # Tag releases require the signing secret configured before push; see docs/RELEASING.md.
      - name: Preflight release secrets
        if: needs.release-meta.outputs.is_release == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            missing="${missing} TAURI_SIGNING_PRIVATE_KEY"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::Tag release requires GitHub Actions secrets:${missing}. Configure them before pushing a tag (see docs/RELEASING.md)."
            exit 1
          fi
          echo "Release secrets preflight passed."

      # tauri.conf.json enables createUpdaterArtifacts + a pinned updater pubkey;
      # Tauri v2 fails the bundle when a pubkey exists but TAURI_SIGNING_PRIVATE_KEY
      # is absent. PR/push builds have no signing key, so overlay the flag off via a
      # small JSON file (not inline --config JSON) to avoid Windows/PowerShell quoting.
      - name: Write CI updater overlay (non-release builds)
        if: needs.release-meta.outputs.is_release != 'true'
        shell: bash
        run: |
          cat > src-tauri/ci-updater-off.json <<'EOF'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          EOF

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          # Releases publish to this repo (kdcllc/fin-app) with the workflow's own
          # GITHUB_TOKEN (contents: write); tauri-action@v0 reads it from env.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.release-meta.outputs.is_release == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.release-meta.outputs.is_release == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ needs.release-meta.outputs.is_release == 'true' && needs.release-meta.outputs.tag || '' }}
          releaseName: ${{ needs.release-meta.outputs.is_release == 'true' && format('fin-app {0}', needs.release-meta.outputs.tag) || '' }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ needs.release-meta.outputs.is_release == 'true' }}
          # On a push to main the tag does not exist yet: the release is created on this
          # exact commit, which creates the tag. On a tag push the tag already points here.
          releaseCommitish: ${{ needs.release-meta.outputs.is_release == 'true' && github.sha || '' }}
          # tauri-action appends args to `tauri build`; --config path is resolved
          # relative to the repo root (tauri-action default projectPath `.`). Tag builds use committed config as-is.
          args: ${{ needs.release-meta.outputs.is_release != 'true' && '--config src-tauri/ci-updater-off.json' || '' }}

      - name: Upload OS installers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fin-app-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg

  verify-release:
    # Tag builds: the published latest.json must list Linux, Windows and macOS
    # with url + signature. PR/push builds publish nothing, so instead the
    # uploaded installer artifacts must include all three platforms.
    name: Verify release artifacts
    needs:
      - release-meta
      - build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts (non-release builds)
        if: needs.release-meta.outputs.is_release != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: fin-app-*
          path: installers

      - name: Assert Linux, Windows, and macOS installers present (non-release builds)
        if: needs.release-meta.outputs.is_release != 'true'
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          ls installers/fin-app-ubuntu-22.04/deb/*.deb >/dev/null 2>&1 || missing="${missing} linux(.deb)"
          ls installers/fin-app-windows-latest/msi/*.msi >/dev/null 2>&1 || missing="${missing} windows(.msi)"
          ls installers/fin-app-macos-latest/dmg/*.dmg >/dev/null 2>&1 || missing="${missing} macOS(.dmg)"
          find installers -type f | sort
          if [ -n "${missing}" ]; then
            echo "::error::Installer artifacts missing for:${missing}"
            exit 1
          fi
          echo "Installers present for Linux, Windows, and macOS."

      - name: Download latest.json from this repo's release
        if: needs.release-meta.outputs.is_release == 'true'
        env:
          TAG: ${{ needs.release-meta.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/latest.json"
          echo "Fetching ${url}"
          curl -fsSL -o latest.json "${url}"

      - name: Assert Linux, Windows, and macOS platforms present
        if: needs.release-meta.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import sys

          with open("latest.json", encoding="utf-8") as f:
              data = json.load(f)

          platforms = data.get("platforms") or {}
          keys = set(platforms.keys())
          missing = []
          if not any(k.startswith("linux-") for k in keys):
              missing.append("linux")
          if not any(k.startswith("windows-") for k in keys):
              missing.append("windows")
          if not any(k.startswith("darwin-") for k in keys):
              missing.append("macOS (darwin)")

          if missing:
              print(
                  f"::error::latest.json missing platform entries for: {', '.join(missing)}. "
                  "Release is incomplete — partial updater manifests are not accepted."
              )
              print("Present platform keys:", sorted(keys))
              sys.exit(1)

          for key in sorted(keys):
              entry = platforms[key]
              if not entry.get("url") or not entry.get("signature"):
                  print(f"::error::latest.json entry {key} missing url or signature")
                  sys.exit(1)

          print("latest.json includes Linux, Windows, and macOS with url + signature.")
          PY

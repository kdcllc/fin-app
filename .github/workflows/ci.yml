name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  quality-js:
    name: Lint, Typecheck, and Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

  quality-rust:
    name: Rust Tests and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux system dependencies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$f"
            fi
          done
          for attempt in 1 2 3; do
            if sudo apt-get update \
              && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev \
                libgtk-3-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                patchelf; then
              exit 0
            fi
            echo "apt failed (attempt ${attempt}); retrying..."
            sleep 5
          done
          echo "apt failed after 3 attempts"
          exit 1

      - name: Test (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy gate
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  build-tauri:
    name: Build Tauri (${{ matrix.platform }})
    needs:
      - quality-js
      - quality-rust
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$f"
            fi
          done
          for attempt in 1 2 3; do
            if sudo apt-get update \
              && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev \
                libgtk-3-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                patchelf; then
              exit 0
            fi
            echo "apt failed (attempt ${attempt}); retrying..."
            sleep 5
          done
          echo "apt failed after 3 attempts"
          exit 1

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('fin-app {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
